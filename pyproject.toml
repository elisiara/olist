[project]
name = "olist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow==17.0.0",
    "streamlit>=1.65.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["test/*", "app.py", "ui.py", ".venv/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
